name: Release PR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; write scopes are granted only to the job that needs them.
permissions: {}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config while third-party install code runs.
          # changesets/action injects its own credentials for its pushes, and the tag
          # step below authenticates explicitly.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
        with:
          version: 10.34.5

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts: no dependency lifecycle scripts (nor our postinstall prisma generate)
      # run in a job that holds a write token. The release flow only needs @changesets/cli,
      # so the Prisma client is not generated here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.0.0-next.3 (commit)
        with:
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git tag and GitHub release
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout ran with persist-credentials: false, so authenticate origin for this step only
          # and restore the token-less URL when the step exits.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "${TAG} already exists; skipping tag creation."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping release creation."
          else
            gh release create "${TAG}" --title "DentPro ${TAG}" --generate-notes
          fi
