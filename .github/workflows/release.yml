name: Release PR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@v2.0.0-next.3
        with:
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git tag and GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): version packages')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "${TAG} already exists; skipping tag creation."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping release creation."
          else
            gh release create "${TAG}" --title "DentPro ${TAG}" --generate-notes
          fi
