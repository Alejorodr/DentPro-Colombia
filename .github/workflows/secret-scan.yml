name: Secret Scan

# Busca secretos filtrados (claves, tokens, URLs con contraseña) en todo el historial de Git.
# Complementa el secret scanning y la push protection de GitHub (DOG-20).
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Imagen oficial fijada por digest (v8.28.0). --redact evita que un hallazgo
      # imprima el secreto en el log público del workflow.
      - name: Escanear historial con gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --log-opts="--all" --redact --no-banner --exit-code 1
